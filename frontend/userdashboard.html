<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Dashboard — Nutriverse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg nv-navbar sticky-top" id="nv-navbar-root"></nav>

<div class="container py-4">
  <h1 class="mb-1" id="greeting">My dashboard</h1>
  <p class="text-muted mb-4">Your notifications and uploads.</p>

  <div id="login-warning" class="alert alert-warning d-none">
    Log in to see your dashboard.
  </div>

  <ul class="nav nav-tabs mb-4">
    <li class="nav-item"><button class="nav-link active" data-pane="notifications">Notifications</button></li>
    <li class="nav-item"><button class="nav-link" data-pane="uploads">My uploads</button></li>
    <li class="nav-item"><button class="nav-link" data-pane="saved">Saved classes</button></li>
    <li class="nav-item"><button class="nav-link" data-pane="progress">Skill ladder</button></li>
  </ul>

  <div id="pane-notifications" class="dash-pane"></div>
  <div id="pane-uploads" class="dash-pane d-none"></div>
  <div id="pane-saved" class="dash-pane d-none"></div>
  <div id="pane-progress" class="dash-pane d-none"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="apiclient.js"></script>
<script src="ingredient-icons.js"></script>
<script>
  const currentUser = nvGetCurrentUser();

  function renderNotifications(notifications) {
    const pane = document.getElementById("pane-notifications");
    if (notifications.length === 0) {
      pane.innerHTML = `<div class="nv-empty-state">You're all caught up.</div>`;
      return;
    }
    pane.innerHTML = `<div class="nv-card">` + notifications.map(n => `
      <div class="p-3 border-bottom">
        <div>${n.message}</div>
        <div class="text-muted small">${new Date(n.created_at).toLocaleString()}</div>
      </div>`).join("") + `</div>`;
  }

  function renderUploads(uploads) {
    const pane = document.getElementById("pane-uploads");
    if (uploads.length === 0) {
      pane.innerHTML = `<div class="nv-empty-state">You haven't uploaded a class yet. <a href="upload.html">Upload one</a>.</div>`;
      return;
    }
    const badgeClass = { pending: "nv-badge-pending", approved: "nv-badge-approved", rejected: "nv-badge-rejected" };
    pane.innerHTML = `<div class="nv-card">` + uploads.map(u => `
      <div class="p-3 border-bottom d-flex align-items-center gap-3">
        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
             style="width:44px;height:44px;background:${(NV_CATEGORY_ART[u.category] || {}).gradient || '#F3E9D8'};font-size:1.3rem;">
          ${(NV_CATEGORY_ART[u.category] || {}).emoji || "🍽️"}
        </div>
        <div class="flex-grow-1">
          <div class="fw-semibold">${u.title}</div>
          <div class="text-muted small">Submitted ${new Date(u.created_at).toLocaleDateString()}</div>
        </div>
        <span class="badge ${badgeClass[u.status]}">${u.status}</span>
      </div>`).join("") + `</div>`;
  }

  // Favorites (user_favorites, via social.js) is distinct from likes —
  // a like is a lightweight signal, a favorite is the user's saved list —
  // and unlike likes, favorites DO have a GET endpoint, so this tab is
  // fully wired.
  function renderSaved(favorites) {
    const pane = document.getElementById("pane-saved");
    if (favorites.length === 0) {
      pane.innerHTML = `<div class="nv-empty-state">Nothing saved yet. Open a class and hit "Save to favorites".</div>`;
      return;
    }
    pane.innerHTML = `<div class="nv-masonry">` + favorites.map((c) => `
      <div class="nv-masonry-item">
        <a href="classdetail.html?id=${c.id}" class="text-decoration-none">
          <div class="nv-card">
            ${nvCardArtHtml(c)}
            <div class="p-3">
              <h6 class="nv-heading mb-1">${c.title}</h6>
              <div class="text-muted small">${nvLabel("meal_time", c.meal_time)} &middot; ${nvLabel("time_needed", c.time_needed)}</div>
            </div>
          </div>
        </a>
      </div>`).join("") + `</div>`;
  }

  function renderSkillLadder(ladder) {
    const pane = document.getElementById("pane-progress");
    const LEVELS = ["beginner", "intermediate", "advanced"];
    pane.innerHTML = `
      <div class="row g-3 mb-4">
        <div class="col-4"><div class="nv-stat-card"><div class="num">${ladder.completed_by_level.beginner}</div><div class="label">Beginner completed</div></div></div>
        <div class="col-4"><div class="nv-stat-card"><div class="num">${ladder.completed_by_level.intermediate}</div><div class="label">Intermediate completed</div></div></div>
        <div class="col-4"><div class="nv-stat-card"><div class="num">${ladder.completed_by_level.advanced}</div><div class="label">Advanced completed</div></div></div>
      </div>
      <div class="nv-card p-3 mb-3">
        <div class="fw-semibold mb-1">Current level: ${nvLabel("skill_level", ladder.current_level)}</div>
        ${ladder.next_goal ? `
          <div class="text-muted small mb-2">${ladder.next_goal.remaining} more ${nvLabel("skill_level", ladder.current_level).toLowerCase()} class${ladder.next_goal.remaining === 1 ? "" : "es"} to unlock ${nvLabel("skill_level", ladder.next_goal.unlocks)}</div>
          <div class="nv-progress-track"><div class="nv-progress-fill" style="width:${Math.min(100, Math.round((ladder.next_goal.completed / ladder.next_goal.needed) * 100))}%"></div></div>
        ` : `<div class="text-muted small">You've unlocked every level 🎉</div>`}
      </div>
      <div class="d-flex gap-3">
        ${LEVELS.map((lvl) => `
          <span class="badge ${ladder.unlocked[lvl] ? "nv-badge-approved" : "text-bg-light"}">${ladder.unlocked[lvl] ? "✓ " : ""}${nvLabel("skill_level", lvl)}</span>
        `).join("")}
      </div>`;
  }

  document.querySelectorAll("[data-pane]").forEach((tab) => {
    tab.addEventListener("click", () => {
      document.querySelectorAll("[data-pane]").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll(".dash-pane").forEach((p) => p.classList.add("d-none"));
      document.getElementById(`pane-${tab.dataset.pane}`).classList.remove("d-none");
    });
  });

  async function load() {
    nvRenderNavbar("dashboard");
    if (!currentUser) {
      document.getElementById("login-warning").classList.remove("d-none");
      renderNotifications([]);
      renderUploads([]);
      renderSaved([]);
      return;
    }

    document.getElementById("greeting").textContent = `Welcome back, ${currentUser.name}`;

    try {
      const notifications = await nvGetNotifications(currentUser.id);
      renderNotifications(notifications);
    } catch (err) {
      document.getElementById("pane-notifications").innerHTML =
        `<div class="alert alert-warning">Couldn't load notifications: ${err.message}</div>`;
    }

    try {
      // No dedicated "my uploads" endpoint yet — fetch each status and
      // filter client-side by uploader_id. Inefficient; worth asking for
      // a real GET /api/my-uploads?user_id= endpoint.
      const [pending, approved, rejected] = await Promise.all([
        nvGetPendingClasses(),
        nvGetClasses({ status: "approved" }),
        nvGetClasses({ status: "rejected" }),
      ]);
      const mine = [...pending, ...approved, ...rejected]
        .filter(c => String(c.uploader_id) === String(currentUser.id))
        .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      renderUploads(mine);
    } catch (err) {
      document.getElementById("pane-uploads").innerHTML =
        `<div class="alert alert-warning">Couldn't load uploads: ${err.message}</div>`;
    }

    try {
      const favorites = await nvGetFavorites(currentUser.id);
      renderSaved(favorites);
    } catch (err) {
      document.getElementById("pane-saved").innerHTML =
        `<div class="alert alert-warning">Couldn't load saved classes: ${err.message}</div>`;
    }

    try {
      const ladder = await nvGetSkillLadder(currentUser.id);
      renderSkillLadder(ladder);
    } catch (err) {
      document.getElementById("pane-progress").innerHTML =
        `<div class="alert alert-warning">Couldn't load skill ladder: ${err.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
